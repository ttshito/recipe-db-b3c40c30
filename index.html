<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>レシピ検索ツール</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍳</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <h1>レシピ検索ツール <span class="sub">モック v0.2</span></h1>
  <nav class="tabs" role="tablist">
    <button role="tab" data-mode="make">冷蔵庫から作れる料理</button>
    <button role="tab" data-mode="search">具材で検索 (AND)</button>
  </nav>
  <div class="topbar-actions">
    <label class="switch" title="ONにすると「胡椒はどれでも可」のように同義グループ内の具材を同一視します">
      <input type="checkbox" id="syn"> <span>同義グループ</span>
    </label>
    <button id="share" class="ghost">URLをコピー</button>
  </div>
</header>

<main class="layout">
  <aside class="panel" id="panel">
    <details open id="panel-details">
      <summary>具材を選ぶ <span id="sel-count" class="count"></span></summary>
      <div class="panel-tools">
        <input type="search" id="ing-filter" placeholder="具材名で絞り込み">
        <div class="panel-buttons">
          <button id="bulk-seas" class="ghost small" title="よく使う(rarity 1)調味料をまとめて選択">よく使う調味料を全部☑</button>
          <button id="clear" class="ghost small">選択をクリア</button>
        </div>
      </div>
      <div id="categories"></div>
    </details>
  </aside>

  <section class="results">
    <div class="controls" id="controls"></div>
    <div class="selected" id="selected"></div>
    <div class="summary" id="summary"></div>
    <div class="cards" id="cards"></div>
  </section>
</main>

<div id="toast" class="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
